apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-app
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: 'https://github.com/abdelrahmanelfekyy-cloud/End-To-End-GitOps-project.git'
    targetRevision: HEAD
    path: 'k8s-argo'
  
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true